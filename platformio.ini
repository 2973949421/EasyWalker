[platformio]
default_envs = bench-a

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
lib_ldf_mode = deep+
extra_scripts = post:tools/check_launcher_size.py

build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DADV_WALKMAN_VERSION=\"0.2.0-p0.ab-match\"

lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
    z3t0/IRremote@4.7.1

[env:bench-a]
build_flags =
    ${env.build_flags}
    -DBENCH_BACKEND_ID=0
lib_deps =
    ${env.lib_deps}
    earlephilhower/ESP8266Audio@1.9.7
build_src_filter =
    +<*>
    -<CandidateBBackend.cpp>
    -<CandidateCBackend.cpp>

[env:bench-b]
build_flags =
    ${env.build_flags}
    -DBENCH_BACKEND_ID=1
build_src_filter =
    +<*>
    -<CandidateABackend.cpp>
    -<CandidateCBackend.cpp>
lib_deps =
    ${env.lib_deps}
    earlephilhower/ESP8266Audio@1.9.7

[env:bench-c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
build_flags =
    ${env.build_flags}
    -DBENCH_BACKEND_ID=2
build_src_filter =
    +<*>
    -<CandidateABackend.cpp>
    -<CandidateBBackend.cpp>
lib_deps =
    ${env.lib_deps}
    earlephilhower/BackgroundAudio@1.4.4
