[platformio]
default_envs = player-dev

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
lib_ldf_mode = deep+
extra_scripts = post:tools/check_launcher_size.py
custom_launcher_app_limit = 0xA0000

build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
    z3t0/IRremote@4.7.1

[env:bench-a]
build_flags =
    ${env.build_flags}
    -DBENCH_BACKEND_ID=0
    -DADV_WALKMAN_VERSION=\"0.2.0-p0.a-stresslog2\"
lib_deps =
    ${env.lib_deps}
    earlephilhower/ESP8266Audio@1.9.7
build_src_filter =
    +<*>
    -<player/**>
    -<CandidateBBackend.cpp>
    -<CandidateCBackend.cpp>

[env:bench-b]
build_flags =
    ${env.build_flags}
    -DBENCH_BACKEND_ID=1
    -DADV_WALKMAN_VERSION=\"0.2.0-p0.ab-final\"
build_src_filter =
    +<*>
    -<player/**>
    -<CandidateABackend.cpp>
    -<CandidateCBackend.cpp>
lib_deps =
    ${env.lib_deps}
    earlephilhower/ESP8266Audio@1.9.7

[env:bench-c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
custom_launcher_app_limit = 0x3F0000
build_flags =
    ${env.build_flags}
    -DBENCH_BACKEND_ID=2
    -DADV_WALKMAN_VERSION=\"0.2.0-p0.c-deferred\"
build_src_filter =
    +<*>
    -<player/**>
    -<CandidateABackend.cpp>
    -<CandidateBBackend.cpp>
lib_deps =
    ${env.lib_deps}
    earlephilhower/BackgroundAudio@1.4.4

[env:player-dev]
custom_launcher_app_limit = 0x140000
build_flags =
    ${env.build_flags}
    -DADV_WALKMAN_VERSION=\"0.8.4-p3d.renderfix\"
build_src_filter =
    -<*>
    +<player/**>
    -<player/PlayerMain.cpp>
    -<player/app/P1DeviceTestRunner.cpp>
    -<player/support/P1Fixtures.cpp>
    -<player/p2gate/**>
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
    earlephilhower/ESP8266Audio@1.9.7

[env:player-p3a-gate]
custom_launcher_app_limit = 0x140000
build_flags =
    ${env.build_flags}
    -DP3A_DEVICE_GATE=1
    -DADV_WALKMAN_VERSION=\"0.8.4-p3d.renderfix\"
build_src_filter =
    -<*>
    +<player/**>
    -<player/PlayerMain.cpp>
    -<player/app/P1DeviceTestRunner.cpp>
    -<player/support/P1Fixtures.cpp>
    -<player/p2gate/**>
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
    earlephilhower/ESP8266Audio@1.9.7

[env:player-p1-gate-a]
custom_launcher_app_limit = 0x140000
build_flags =
    ${env.build_flags}
    -DP1_DEVICE_GATE=1
    -DADV_WALKMAN_VERSION=\"0.3.0-p1.gate-a2\"
build_src_filter =
    -<*>
    +<player/**>
    -<player/app/LibraryRuntime.cpp>
    -<player/app/PlayerDevMain.cpp>
    -<player/library/**>
    -<player/p2gate/**>
    -<player/ui/**>
    -<player/p3a/**>
    -<player/p3abc/**>
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
    earlephilhower/ESP8266Audio@1.9.7

[env:player-p1-gate-b]
custom_launcher_app_limit = 0x140000
build_flags =
    ${env.build_flags}
    -DP1_DEVICE_GATE=2
    -DADV_WALKMAN_VERSION=\"0.3.0-p1.gate-b\"
build_src_filter =
    -<*>
    +<player/**>
    -<player/app/LibraryRuntime.cpp>
    -<player/app/PlayerDevMain.cpp>
    -<player/library/**>
    -<player/p2gate/**>
    -<player/ui/**>
    -<player/p3a/**>
    -<player/p3abc/**>
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
    earlephilhower/ESP8266Audio@1.9.7

[env:player-p2-gate]
custom_launcher_app_limit = 0x140000
build_flags =
    ${env.build_flags}
    -DADV_WALKMAN_VERSION=\"0.4.4-p2.final-gate\"
build_src_filter =
    -<*>
    +<player/**>
    -<player/PlayerMain.cpp>
    -<player/app/PlayerDevMain.cpp>
    -<player/app/P1DeviceTestRunner.cpp>
    -<player/support/P1Fixtures.cpp>
    -<player/ui/**>
    -<player/p3a/**>
    -<player/p3abc/**>
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.20
    m5stack/M5GFX@0.2.27
    earlephilhower/ESP8266Audio@1.9.7

[env:player-p3abc-gate]
extends = env:player-dev
build_flags =
    ${env.build_flags}
    -DP3ABC_DEVICE_GATE=1
    -DADV_WALKMAN_VERSION=\"0.8.4-p3d.renderfix\"
